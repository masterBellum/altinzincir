name: Tarihsel Veri Rollup (1 saat)

on:
  schedule:
    # Her saatin başında çalışır
    - cron: '0 * * * *'
  repository_dispatch:
    types: [build-history]
  workflow_dispatch:

# Sadece kendi kendine üst üste binmeyi engeller; çapraz push çakışması
# commit adımındaki pull --rebase + retry döngüsüyle çözülüyor.
concurrency:
  group: data-push-history
  cancel-in-progress: false

jobs:
  build-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write   # arıza durumunda Issue açmak için

    steps:
      - name: Kodu Al
        uses: actions/checkout@v5
        with:
          # Son commit'i al — prices workflow'u az önce güncellemiş olabilir
          fetch-depth: 1
          ref: main

      - name: Node.js Kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Önce accumulator'ı (data/history.json) güncelle...
      - name: History Rollup'ı Çalıştır
        run: node scripts/build_history.js

      # ...sonra data/history/ dosyalarını üret. Bu adım prices workflow'unda
      # SKIP_HISTORY=1 ile atlanıyor (repo şişmesini önlemek için), o yüzden
      # buradaki bayraksız tam çalıştırma tek üretim noktası. build_history.js'ten
      # SONRA çalışmalı: adım 7 overlay'i taze accumulator'dan okuyor.
      - name: History Dosyalarını Üret
        run: node scripts/fetch_current.js

      - name: Değişikliği Commit & Push Et
        run: |
          git config --global user.name  "AltinZincir-Bot"
          git config --global user.email "bot@altinzincir.app"
          git add data/history.json data/history/ data/current.json
          if git diff --cached --quiet; then
            echo "History değişikliği yok"
            exit 0
          fi
          git commit -m "tarih: $(date -u '+%Y-%m-%d %H:00 UTC')"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ Push başarılı (deneme $i)"
              exit 0
            fi
            echo "⚠️  Push denemesi $i başarısız — yeniden deneniyor"
            sleep $((i * 5))
          done
          echo "❌ Push 5 denemede de başarısız oldu"
          exit 1

      - name: Arıza Bildir
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 History pipeline arızası';
            const body  = `\`${context.workflow}\` başarısız oldu.\n\n`
              + `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`
              + `- Tetikleyici: \`${context.eventName}\`\n`
              + `- Zaman: ${new Date().toISOString()}\n`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'pipeline-failure',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pipeline-failure'],
              });
            }
