name: Fetch News

on:
  schedule:
    - cron: '*/30 * * * *'   # Her 30 dakikada bir
  repository_dispatch:
    types: [fetch-news]
  workflow_dispatch:           # Manuel tetikleme

# Sadece kendi kendine üst üste binmeyi engeller; çapraz push çakışması
# commit adımındaki pull --rebase + retry döngüsüyle çözülüyor.
concurrency:
  group: data-push-news
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch news
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: node scripts/fetch_news.js

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Haber değişikliği yok"
            exit 0
          fi
          git commit -m "chore: news update $(date -u +'%H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ Push başarılı (deneme $i)"
              exit 0
            fi
            echo "⚠️  Push denemesi $i başarısız — yeniden deneniyor"
            sleep $((i * 5))
          done
          echo "❌ Push 5 denemede de başarısız oldu"
          exit 1
