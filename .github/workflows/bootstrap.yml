name: Bootstrap Tarihsel Veri (Tek Seferlik)

on:
  workflow_dispatch: # Sadece manuel tetikleme

# 30 dakika sürüyor ve data/history.json'ı baştan yazıyor — yanlışlıkla
# iki kez tetiklenirse üst üste binmesin.
concurrency:
  group: data-push-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Kodu Al
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: main

      - name: Node.js Kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bootstrap Çalıştır
        run: node scripts/bootstrap_history.js

      - name: Değişikliği Commit & Push Et
        run: |
          git config --global user.name  "AltinZincir-Bot"
          git config --global user.email "bot@altinzincir.app"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "bootstrap: 5 yıllık tarihsel veri eklendi $(date -u '+%Y-%m-%d')"
          # history workflow'u da data/history.json'a yazıyor — çakışmaya karşı
          # rebase + tekrar denemeli push (diğer workflow'larla aynı desen)
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ Push başarılı (deneme $i)"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "⚠️  Push denemesi $i başarısız — yeniden deneniyor"
            sleep $((i * 5))
          done
          echo "❌ Push 5 denemede de başarısız oldu"
          exit 1
