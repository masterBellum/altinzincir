name: Canlı Fiyat Güncellemesi (5 dk)

on:
  schedule:
    # YEDEK tetikleyici. GitHub scheduled cron'u ağır throttle'lıyor —
    # ölçülen gerçek aralık ~57 dk. Asıl tetikleme repository_dispatch ile
    # harici cron servisinden (cron-job.org) geliyor.
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [fetch-prices]
  workflow_dispatch: # Manuel tetikleme butonu

# Sadece kendi kendine üst üste binmeyi engeller. Diğer workflow'larla olan
# push çakışması commit adımındaki pull --rebase + retry döngüsüyle çözülüyor;
# ortak grup kullanılırsa bekleyen history/news run'ları iptal olabiliyordu.
concurrency:
  group: data-push-prices
  cancel-in-progress: false

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write   # arıza durumunda Issue açmak için

    steps:
      - name: Kodu Al
        uses: actions/checkout@v5

      - name: Node.js Kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # SKIP_HISTORY=1: history üretimi (adım 5-6-7) atlanır. Bu adımlar her
      # çalıştırmada ~962 dosya değiştirip repoyu şişiriyor ve run'a ~45 sn
      # ekliyordu. 5 dk'lık kadansta sadece current.json güncellenir;
      # data/history/ üretimini saatlik history workflow'u yapar.
      - name: Anlık Fiyatları Çek
        env:
          SKIP_HISTORY: '1'
        run: node scripts/fetch_current.js

      - name: Değişikliği Commit & Push Et
        run: |
          git config --global user.name  "AltinZincir-Bot"
          git config --global user.email "bot@altinzincir.app"
          git add data/current.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "fiyat+tarih: $(date -u '+%H:%M UTC')"
          # Eşzamanlı push'lara karşı rebase + tekrar denemeli push
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ Push başarılı (deneme $i)"
              exit 0
            fi
            # Rebase çakışmada yarım kalırsa repo "unmerged files" durumunda
            # kilitleniyor ve sonraki denemeler de aynı hatayla düşüyor.
            # Temiz duruma dön ki retry gerçekten yeniden deneyebilsin.
            git rebase --abort 2>/dev/null || true
            echo "⚠️  Push denemesi $i başarısız — yeniden deneniyor"
            sleep $((i * 5))
          done
          echo "❌ Push 5 denemede de başarısız oldu"
          exit 1

      # Pipeline sessizce bozulmasın: arıza durumunda GitHub Issue aç/güncelle.
      - name: Arıza Bildir
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Fiyat pipeline arızası';
            const body  = `\`${context.workflow}\` başarısız oldu.\n\n`
              + `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`
              + `- Tetikleyici: \`${context.eventName}\`\n`
              + `- Zaman: ${new Date().toISOString()}\n`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'pipeline-failure',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pipeline-failure'],
              });
            }
